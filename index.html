<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Painel — Miguel</title>
<meta name="description" content="Painel pessoal de rotina, metas, recuperação e prazos escolares.">
<meta name="theme-color" content="#14161a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<body style="margin:0;">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg: #14161a;
    --panel: #1c1f26;
    --panel-2: #22262f;
    --line: #2c313c;
    --ink: #e8e6e1;
    --ink-dim: #9aa0ac;
    --accent: #5b9aa3;
    --accent-dim: #3e6a71;
    --warn: #d98e4a;
    --crit: #c1666b;
    --ok: #7fae7a;
  }
  *{box-sizing:border-box;}
  #gv-root{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:0;
    display:flex;
    flex-direction:column;
  }
  .gv-mono{font-family:'JetBrains Mono',monospace;}
  .gv-display{font-family:'Space Grotesk',sans-serif;}

  .gv-header{
    padding:20px 24px 16px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .gv-header h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:20px;
    font-weight:700;
    margin:0;
    letter-spacing:0.02em;
  }
  .gv-header .gv-sub{
    color:var(--ink-dim);
    font-size:12px;
    font-family:'JetBrains Mono',monospace;
  }

  .gv-tabs{
    display:flex;
    gap:2px;
    padding:0 24px;
    border-bottom:1px solid var(--line);
    overflow-x:auto;
    background:var(--panel);
  }
  .gv-tab{
    padding:12px 14px;
    font-size:13px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    color:var(--ink-dim);
    background:none;
    border:none;
    border-bottom:2px solid transparent;
    cursor:pointer;
    white-space:nowrap;
  }
  .gv-tab.active{
    color:var(--accent);
    border-bottom-color:var(--accent);
  }
  .gv-tab:hover:not(.active){color:var(--ink);}

  .gv-main{
    padding:20px 24px 60px;
    max-width:920px;
    width:100%;
    margin:0 auto;
    flex:1;
  }

  .gv-grid{display:grid; gap:14px;}
  .gv-grid.cols-2{grid-template-columns:1fr 1fr;}
  @media (max-width:640px){.gv-grid.cols-2{grid-template-columns:1fr;}}

  .gv-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:16px;
  }
  .gv-card h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:14px;
    font-weight:700;
    margin:0 0 10px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--ink-dim);
  }

  .gv-deadline-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px solid var(--line);
    gap:10px;
  }
  .gv-deadline-row:last-child{border-bottom:none;}
  .gv-deadline-name{font-size:13.5px; font-weight:500;}
  .gv-deadline-sub{font-size:11px; color:var(--ink-dim); font-family:'JetBrains Mono',monospace;}
  .gv-pill{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    padding:3px 8px;
    border-radius:999px;
    white-space:nowrap;
    font-weight:700;
  }
  .gv-pill.crit{background:rgba(193,102,107,0.15); color:var(--crit);}
  .gv-pill.warn{background:rgba(217,142,74,0.15); color:var(--warn);}
  .gv-pill.ok{background:rgba(127,174,122,0.15); color:var(--ok);}

  .gv-bar-track{
    height:6px;
    background:var(--panel-2);
    border-radius:3px;
    overflow:hidden;
    margin-top:6px;
  }
  .gv-bar-fill{height:100%; background:var(--accent); border-radius:3px;}

  .gv-list-item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:9px 0;
    border-bottom:1px solid var(--line);
  }
  .gv-list-item:last-child{border-bottom:none;}
  .gv-check{
    width:18px; height:18px;
    border:1.5px solid var(--ink-dim);
    border-radius:4px;
    flex-shrink:0;
    margin-top:1px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    color:var(--bg);
  }
  .gv-check.done{background:var(--accent); border-color:var(--accent);}
  .gv-item-text{flex:1; font-size:13.5px; line-height:1.4;}
  .gv-item-text.done{color:var(--ink-dim); text-decoration:line-through;}
  .gv-item-meta{font-size:11px; color:var(--ink-dim); font-family:'JetBrains Mono',monospace; margin-top:2px;}
  .gv-del{
    background:none; border:none; color:var(--ink-dim); cursor:pointer;
    font-size:15px; padding:0 4px; line-height:1;
  }
  .gv-del:hover{color:var(--crit);}

  .gv-add-row{
    display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;
  }
  .gv-input, .gv-select{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:6px;
    padding:8px 10px;
    font-size:13px;
    font-family:'Inter',sans-serif;
    flex:1;
    min-width:120px;
  }
  .gv-input:focus, .gv-select:focus{outline:1.5px solid var(--accent); border-color:var(--accent);}
  .gv-btn{
    background:var(--accent);
    color:var(--bg);
    border:none;
    border-radius:6px;
    padding:8px 14px;
    font-size:13px;
    font-weight:700;
    font-family:'Space Grotesk',sans-serif;
    cursor:pointer;
  }
  .gv-btn:hover{background:var(--accent-dim); color:var(--ink);}
  .gv-btn.ghost{background:none; border:1px solid var(--line); color:var(--ink-dim);}
  .gv-btn.ghost:hover{border-color:var(--accent); color:var(--accent);}

  .gv-section-title{
    font-family:'Space Grotesk',sans-serif;
    font-size:16px;
    font-weight:700;
    margin:22px 0 10px;
  }
  .gv-section-title:first-child{margin-top:0;}

  .gv-metric{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 0; border-bottom:1px solid var(--line);
  }
  .gv-metric:last-child{border-bottom:none;}
  .gv-metric-name{font-size:13.5px; font-weight:500;}
  .gv-metric-hist{font-size:10.5px; color:var(--ink-dim); font-family:'JetBrains Mono',monospace;}
  .gv-metric-val{font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:700; color:var(--accent);}

  .gv-empty{color:var(--ink-dim); font-size:13px; font-style:italic; padding:6px 0;}

  .gv-day-tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
  .gv-day-chip{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    padding:6px 10px;
    border-radius:6px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--ink-dim);
    cursor:pointer;
  }
  .gv-day-chip.active{border-color:var(--accent); color:var(--accent);}
  .gv-day-chip.done-all{color:var(--ok); border-color:var(--ok);}

  .gv-clickable{cursor:pointer; transition:border-color .15s;}
  .gv-clickable:hover{border-color:var(--accent);}

  .gv-back{
    background:none; border:none; color:var(--accent);
    font-family:'JetBrains Mono',monospace; font-size:12px;
    cursor:pointer; padding:0 0 14px; display:flex; align-items:center; gap:6px;
  }
  .gv-back:hover{text-decoration:underline;}

  .gv-detail-title{
    font-family:'Space Grotesk',sans-serif;
    font-size:22px; font-weight:700; margin:0 0 4px;
  }
  .gv-detail-type{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-dim);
    text-transform:uppercase; letter-spacing:0.06em;
  }

  .gv-textarea{
    background:var(--panel-2); border:1px solid var(--line); color:var(--ink);
    border-radius:6px; padding:10px; font-size:13px; font-family:'Inter',sans-serif;
    width:100%; min-height:70px; resize:vertical;
  }
  .gv-textarea:focus{outline:1.5px solid var(--accent); border-color:var(--accent);}

  .gv-note{
    padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; line-height:1.4;
  }
  .gv-note:last-child{border-bottom:none;}
  .gv-note-date{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink-dim); display:block; margin-bottom:2px;}

  .gv-method-step{
    display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); align-items:flex-start;
  }
  .gv-method-step:last-child{border-bottom:none;}
  .gv-method-time{
    font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700;
    color:var(--accent); min-width:56px; flex-shrink:0;
  }
  .gv-method-body b{color:var(--ink); font-size:13px;}
  .gv-method-body div{font-size:12.5px; color:var(--ink-dim); margin-top:2px; line-height:1.4;}

  .gv-error-card{
    background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:10px;
  }
  .gv-error-head{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .gv-error-field{font-size:12.5px; margin-top:4px;}
  .gv-error-field b{color:var(--ink-dim); font-weight:600;}
  .gv-rev-row{display:flex; gap:14px; margin-top:8px; flex-wrap:wrap;}
  .gv-rev-item{display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-dim); font-family:'JetBrains Mono',monospace;}
  .gv-rev-item .gv-check{width:15px; height:15px;}

  .gv-chat-msg{
    padding:12px; border-radius:8px; margin-bottom:10px; font-size:13px; line-height:1.5;
    white-space:pre-wrap;
  }
  .gv-chat-msg.user{background:var(--panel-2); border:1px solid var(--line);}
  .gv-chat-msg.ai{background:rgba(91,154,163,0.08); border:1px solid var(--accent-dim);}
  .gv-chat-msg.error{background:rgba(193,102,107,0.1); border:1px solid var(--crit); color:var(--crit);}
  .gv-loading{
    display:flex; align-items:center; gap:8px; color:var(--ink-dim); font-size:12.5px;
    font-family:'JetBrains Mono',monospace; padding:8px 0;
  }
  .gv-dot{width:6px; height:6px; border-radius:50%; background:var(--accent); animation:gv-pulse 1s infinite ease-in-out;}
  .gv-dot:nth-child(2){animation-delay:.15s;} .gv-dot:nth-child(3){animation-delay:.3s;}
  @keyframes gv-pulse{0%,100%{opacity:.3;} 50%{opacity:1;}}
</style>

  const DAY_MS = 86400000;
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function daysUntil(dateStr){
    const now = new Date(todayISO()+'T00:00:00');
    const target = new Date(dateStr+'T00:00:00');
    return Math.round((target - now) / DAY_MS);
  }
  function fmtDate(dateStr){
    const d = new Date(dateStr+'T00:00:00');
    return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric'});
  }
  function uid(){ return Math.random().toString(36).slice(2,10); }

  function dueReviews(e){
    const created = new Date(e.date+'T00:00:00');
    const today = new Date(todayISO()+'T00:00:00');
    const diffDays = Math.round((today-created)/DAY_MS);
    const targets = [{key:'rev1', day:1, label:'D+1'}, {key:'rev3', day:3, label:'D+3'}, {key:'rev7', day:7, label:'D+7'}];
    return targets.filter(t => !e[t.key] && diffDays >= t.day);
  }
  function allDueReviews(){
    let out = [];
    state.errorLog.forEach(e=>{
      const due = dueReviews(e);
      if(due.length) out.push({error:e, due});
    });
    return out;
  }
  function compileContext(){
    const today = todayWeekday();
    const todayItems = state.weeklyRoutine[today] || [];
    const todayLog = state.routineLog[todayISO()] || {};
    const routineDone = todayItems.filter(it=>todayLog[it.id]).length;

    const subjectsSummary = state.subjects.map(s=>{
      const doneT = (s.topicsDone||[]).filter(Boolean).length;
      return `- ${s.name} (${s.label}${s.deadline?`, prazo ${fmtDate(s.deadline)}`:', sem prazo confirmado'}): ${doneT}/${s.topics.length} tópicos revisados`;
    }).join('\n');

    const due = allDueReviews();
    const dueSummary = due.length ? due.map(({error:e,due:d})=>`- ${e.materia}: "${e.questao||'sem descrição'}" (${d.map(x=>x.label).join(', ')})`).join('\n') : 'Nenhuma pendente hoje.';

    const goalsSummary = state.goals.map(g=>`- [${g.type}] ${g.title}: ${g.progress}%`).join('\n');

    const recDay = state.recoveryDays[activeRecoveryDay];
    const recSummary = recDay ? `${recDay.day}: ${recDay.tasks.map(t=>`${t.done?'[feito]':'[pendente]'} ${t.text}`).join('; ')}` : 'sem plano cadastrado';

    return `Hoje é ${today}, ${fmtDate(todayISO())}.

ROTINA DE HOJE: ${routineDone}/${todayItems.length} concluídos. Itens: ${todayItems.map(i=>`${todayLog[i.id]?'[feito]':'[pendente]'} ${i.text}`).join('; ')}

MATÉRIAS E PRAZOS:
${subjectsSummary}

REVISÕES PENDENTES (Caderno de Erros, método D+1/D+3/D+7):
${dueSummary}

METAS E PROJETOS:
${goalsSummary}

RECUPERAÇÃO — DIA ATIVO: ${recSummary}`;
  }

  function sparkline(history){
    if(!history || history.length<2) return '';
    const w=180, h=32, pad=3;
    const vals = history.map(p=>p.value);
    const min = Math.min(...vals), max = Math.max(...vals);
    const range = (max-min)||1;
    const step = (w-pad*2)/(history.length-1);
    const pts = history.map((p,i)=>{
      const x = pad + i*step;
      const y = h - pad - ((p.value-min)/range)*(h-pad*2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;">
      <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>`;
  }

  async function cloudGet(){
    const res = await fetch(`https://api.github.com/gists/${SYNC_CONFIG.gistId}`, {
      headers: {
        'Authorization': `token ${SYNC_CONFIG.token}`,
        'Accept': 'application/vnd.github+json'
      }
    });
    if(!res.ok) throw new Error('cloud get failed: '+res.status);
    const data = await res.json();
    const fileContent = data.files && data.files['data.json'] ? data.files['data.json'].content : null;
    if(!fileContent) return null;
    return JSON.parse(fileContent);
  }
  async function cloudSet(obj){
    const res = await fetch(`https://api.github.com/gists/${SYNC_CONFIG.gistId}`, {
      method: 'PATCH',
      headers: {
        'Authorization': `token ${SYNC_CONFIG.token}`,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ files: { 'data.json': { content: JSON.stringify(obj) } } })
    });
    if(!res.ok) throw new Error('cloud set failed: '+res.status);
  }

  function migrateState(){
    if(!state.errorLog) state.errorLog = [];
    if(!state.methodSteps) state.methodSteps = DEFAULT_STATE.methodSteps;
    if(!state.weeklyRoutine) state.weeklyRoutine = DEFAULT_STATE.weeklyRoutine;
    if(!state.routineLog) state.routineLog = {};
    (state.goals||[]).forEach(g=>{ if(g.description===undefined) g.description=''; if(!g.notes) g.notes=[]; if(!g.checklist) g.checklist=[]; if(!g.status) g.status='ativo'; });
    (state.subjects||[]).forEach(s=>{ if(!s.notes) s.notes=[]; });
  }

  async function loadState(){
    const statusEl = document.getElementById('gv-status');
    try{
      if(SYNC_ENABLED){
        if(statusEl) statusEl.textContent = 'sincronizando...';
        try{
          const cloud = await cloudGet();
          if(cloud && cloud.subjects){
            state = cloud;
          } else {
            state = DEFAULT_STATE;
            await cloudSet(state);
          }
        }catch(cloudErr){
          console.error('Falha na nuvem, usando local', cloudErr);
          const res = await window.storage.get(STORAGE_KEY, false).catch(()=>null);
          state = (res && res.value) ? JSON.parse(res.value) : DEFAULT_STATE;
          if(statusEl) statusEl.textContent = 'offline (sem nuvem)';
        }
      } else {
        const res = await window.storage.get(STORAGE_KEY, false);
        if(res && res.value){
          state = JSON.parse(res.value);
        } else {
          state = DEFAULT_STATE;
          await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
        }
      }
      migrateState();
    }catch(e){
      state = DEFAULT_STATE;
      migrateState();
    }
    if(statusEl) statusEl.textContent = SYNC_ENABLED ? 'sincronizado' : 'somente local';
    const refreshBtn = document.getElementById('gv-sync-refresh');
    if(refreshBtn){
      refreshBtn.style.display = SYNC_ENABLED ? 'inline-block' : 'none';
      refreshBtn.onclick = ()=>{ loadState(); };
    }
    render();
  }

  let saveTimer = null;
  async function saveState(){
    const statusEl = document.getElementById('gv-status');
    try{
      if(SYNC_ENABLED){
        await cloudSet(state);
        if(statusEl) statusEl.textContent = 'sincronizado';
      } else {
        await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
      }
    }catch(e){
      console.error('Erro ao salvar', e);
      if(statusEl) statusEl.textContent = 'erro ao sincronizar — salvo só local';
      try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state), false); }catch(e2){}
    }
  }
  function persist(){
    clearTimeout(saveTimer);
    const statusEl = document.getElementById('gv-status');
    if(SYNC_ENABLED && statusEl) statusEl.textContent = 'salvando...';
    saveTimer = setTimeout(saveState, 600);

  function deadlinePill(dateStr){
    if(!dateStr) return `<span class="gv-pill ok">sem prazo definido</span>`;
    const d = daysUntil(dateStr);
    let cls = 'ok';
    if(d < 0) cls='crit';
    else if(d <= 2) cls='crit';
    else if(d <= 5) cls='warn';
    let txt;
    if(d < 0) txt = `venceu há ${Math.abs(d)}d`;
    else if(d === 0) txt = 'hoje';
    else if(d === 1) txt = 'amanhã';
    else txt = `em ${d}d`;
    return `<span class="gv-pill ${cls}">${txt}</span>`;
  }

  function buildResumoText(){
    const today = todayWeekday();
    const todayItems = state.weeklyRoutine[today] || [];
    const todayLog = state.routineLog[todayISO()] || {};
    const routineDone = todayItems.filter(it=>todayLog[it.id]).length;
    const routinePending = todayItems.filter(it=>!todayLog[it.id]).map(it=>it.text);

    const withDeadline = state.subjects.filter(s=>s.deadline).sort((a,b)=>a.deadline.localeCompare(b.deadline));
    const withoutDeadline = state.subjects.filter(s=>!s.deadline);

    const due = allDueReviews();

    const recDay = state.recoveryDays[activeRecoveryDay];
    const recPending = recDay ? recDay.tasks.filter(t=>!t.done).map(t=>t.text) : [];

    let lines = [];
    lines.push(`RESUMO — ${today}, ${fmtDate(todayISO())}`);
    lines.push('');
    lines.push(`ROTINA DE HOJE: ${routineDone}/${todayItems.length} feitos`);
    if(routinePending.length) lines.push('Pendente: ' + routinePending.join('; '));
    lines.push('');
    lines.push('PRAZOS CONFIRMADOS:');
    if(withDeadline.length===0) lines.push('(nenhum confirmado ainda)');
    withDeadline.forEach(s=>lines.push(`- ${s.name} (${s.label}) — ${fmtDate(s.deadline)} (${daysUntil(s.deadline)>=0?`em ${daysUntil(s.deadline)}d`:`atrasado ${Math.abs(daysUntil(s.deadline))}d`})`));
    if(withoutDeadline.length){
      lines.push('');
      lines.push('SEM DATA CONFIRMADA: ' + withoutDeadline.map(s=>s.name).join(', '));
    }
    lines.push('');
    lines.push(`REVISÕES PENDENTES HOJE (Caderno de Erros): ${due.length}`);
    due.forEach(({error:e, due:d})=>lines.push(`- ${e.materia}: "${e.questao||'sem descrição'}" — ${d.map(x=>x.label).join(', ')}`));
    lines.push('');
    lines.push(`RECUPERAÇÃO — ${recDay ? recDay.day : 'sem dia selecionado'}: ${recPending.length} tarefa(s) pendente(s)`);
    recPending.forEach(t=>lines.push(`- ${t}`));
    lines.push('');
    lines.push('METAS E PROJETOS:');
    state.goals.forEach(g=>lines.push(`- [${g.type}] ${g.title}: ${g.progress}%`));

    return lines.join('\n');
  }

      </div>

    </div>`;

    [...state.errorLog].reverse().forEach(e=>{
      const tipoLabel = {C:'Conceito', P:'Procedimento', L:'Leitura', A:'Atenção'}[e.tipo] || e.tipo;
      html += `<div class="gv-error-card">
        <div class="gv-error-head">
          <div>
            <span class="gv-deadline-name">${e.materia}</span>
            <span class="gv-pill warn" style="margin-left:8px;">${tipoLabel}</span>
          </div>
          <button class="gv-del" data-del-err="${e.id}">✕</button>
        </div>
        <div class="gv-error-field"><b>Questão:</b> ${e.questao||'—'}</div>
        <div class="gv-error-field"><b>Regra que faltou:</b> ${e.regra||'—'}</div>
        <div class="gv-error-field"><b>Refeito sem olhar:</b>
          <span class="gv-check ${e.refeito?'done':''}" data-err-refeito="${e.id}" style="display:inline-flex; width:14px; height:14px; vertical-align:middle; margin-left:4px;">${e.refeito?'✓':''}</span>
        </div>
        <div class="gv-rev-row">
          <div class="gv-rev-item"><span class="gv-check ${e.rev1?'done':''}" data-err-rev="${e.id}" data-rev-key="rev1">${e.rev1?'✓':''}</span> D+1</div>
          <div class="gv-rev-item"><span class="gv-check ${e.rev3?'done':''}" data-err-rev="${e.id}" data-rev-key="rev3">${e.rev3?'✓':''}</span> D+3</div>
          <div class="gv-rev-item"><span class="gv-check ${e.rev7?'done':''}" data-err-rev="${e.id}" data-rev-key="rev7">${e.rev7?'✓':''}</span> D+7</div>
        </div>
      </div>`;
    });
    document.getElementById('gv-main').innerHTML = html;

    document.getElementById('gv-add-err').onclick = ()=>{
      const materia = document.getElementById('gv-err-materia').value;
      const questao = document.getElementById('gv-err-questao').value.trim();
      const tipo = document.getElementById('gv-err-tipo').value;
      const regra = document.getElementById('gv-err-regra').value.trim();
      if(!materia) return;
      state.errorLog.push({id:uid(), materia, questao, tipo, regra, refeito:false, rev1:false, rev3:false, rev7:false, date:todayISO()});
      persist(); render();
    };
    document.querySelectorAll('[data-del-err]').forEach(el=>{
      el.onclick = ()=>{
        state.errorLog = state.errorLog.filter(x=>x.id!==el.dataset.delErr);
        persist(); render();
      };
    });
    document.querySelectorAll('[data-err-refeito]').forEach(el=>{
      el.onclick = ()=>{
        const e = state.errorLog.find(x=>x.id===el.dataset.errRefeito);
        e.refeito = !e.refeito; persist(); render();
      };
    });
    document.querySelectorAll('[data-err-rev]').forEach(el=>{
      el.onclick = ()=>{
        const e = state.errorLog.find(x=>x.id===el.dataset.errRev);
        const key = el.dataset.revKey;
        e[key] = !e[key]; persist(); render();
      };
    });
  }

  function render(){
    renderTabs();
    document.getElementById('gv-today').textContent = new Date().toLocaleDateString('pt-BR', {weekday:'long', day:'2-digit', month:'long'});
    if(activeTab==='metas' && detailView && detailView.type==='goal') renderGoalDetail(detailView.id);
    else if(activeTab==='materias' && detailView && detailView.type==='subject') renderSubjectDetail(detailView.id);
    else if(activeTab==='painel') renderPainel();
    else if(activeTab==='rotina') renderRotina();
    else if(activeTab==='metas') renderMetas();
    else if(activeTab==='metricas') renderMetricas();
    else if(activeTab==='recuperacao') renderRecuperacao();
    else if(activeTab==='erros') renderErros();
    else if(activeTab==='materias') renderMaterias();
    else if(activeTab==='resumo') renderResumo();
  }

  loadState();
})();
</script>

<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('service-worker.js').catch(()=>{});
    });
  }
</script>
</body>
</html>
